<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Estética</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agenda Estética</h1>
    </header>

    <main>
        <section id="form-agendamento">
            <input type="date" id="data" required>
            <input type="time" id="horario" required>
            <input type="text" id="cliente" placeholder="Nome do Cliente" required>
            <input type="text" id="procedimento" placeholder="Procedimento" required>
            <button onclick="salvar()">Agendar</button>
        </section>

        <section id="lista-agenda">
            <h2>Próximos Horários</h2>
            <div id="container-agenda">Carregando...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
