<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Estética</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>📅 Agenda Estética</h1>
</header>

<section class="card">

  <h2>Novo Agendamento</h2>

  <form id="agenda-form" action="https://script.google.com/macros/s/AKfycbwd69RxRJBWoLLIUE65Ck-CYQwB4noi6qetFgeNkiYWzcZhEszhWE3LyD6LmyfBfYOn/exec" method="POST">

  <input type="date" id="data" name="data" required>

  <input type="time" id="horario" name="horario" required>

  <input type="text" id="cliente" name="cliente" placeholder="Cliente" required>

  <input type="text" id="procedimento" name="procedimento" placeholder="Procedimento" required>

  <button type="submit">Salvar</button>

</form>

</section>


<section class="card">

  <h2>Agenda</h2>

  <div id="agenda-list"></div>

</section>

<script src="script.js"></script>

</body>
</html>
